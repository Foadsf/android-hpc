name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  host-linux:
    # Builds the portable core and runs the test-suite against software Vulkan (Mesa lavapipe)
    # and software OpenCL (PoCL), so the Vulkan/OpenCL code paths run for real in CI.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain and software GPU drivers
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build glslc libvulkan-dev spirv-tools \
            mesa-vulkan-drivers vulkan-tools pocl-opencl-icd ocl-icd-libopencl1
          vulkaninfo --summary | head -n 20 || true
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - name: Test (every available backend must match the fp64 reference)
        run: ctest --test-dir build --output-on-failure
      - name: Smoke benchmark
        run: ./build/core/hpc_cli --preset small --iters 3 --json build/small.json
      - uses: actions/upload-artifact@v4
        with:
          name: host-linux-report
          path: build/small.json

  sysml-model:
    # Parses and checks model/AndroidHPC.sysml with the FLOSS sysml-v2-lsp (MIT); fails on errors.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install sysml-v2-lsp
        run: npm install --prefix "$RUNNER_TEMP/lsp" sysml-v2-lsp@0.42.0 --ignore-scripts --no-audit --no-fund
      - name: Check the model
        run: node scripts/check-sysml.cjs model/AndroidHPC.sysml --lsp-dir "$RUNNER_TEMP/lsp"

  android-apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;26.1.10909125" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0"
      - name: Fetch the Gradle distribution with retries because services.gradle.org returns 504 at times
        run: |
          for i in 1 2 3 4 5 6; do
            ./gradlew --no-daemon --version && exit 0
            echo "attempt $i failed; retrying in $((i*20))s"; sleep $((i*20))
          done
          exit 1
      - name: Build debug APK
        run: ./gradlew --no-daemon -PbuildNumber=${{ github.run_number }} assembleDebug
      - name: UI tests (Robolectric; renders a real report, checks touch targets, writes screenshots)
        run: ./gradlew --no-daemon testDebugUnitTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: app/build/ui-screenshots
      - name: Verify the APK declares what it must
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging app/build/outputs/apk/debug/app-debug.apk | tee badging.txt
          grep -q "uses-native-library-not-required:'libOpenCL.so'" badging.txt
          grep -q "native-code: 'arm64-v8a'" badging.txt
          grep -q "versionCode='$((100 + ${{ github.run_number }}))'" badging.txt
      - uses: actions/upload-artifact@v4
        with:
          name: android-hpc-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  publish-apk:
    # Every merge (push) to main publishes the APK as a GitHub Release, after all checks passed.
    # Stable download link: https://github.com/<owner>/<repo>/releases/latest/download/android-hpc.apk
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [host-linux, sysml-model, android-apk]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: publish-apk
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: android-hpc-debug-apk
          path: dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -nE 's/^project\(android_hpc VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)
          test -n "$VERSION"
          BUILD=${{ github.run_number }}
          TAG="v${VERSION}-build.${BUILD}"
          cp dist/app-debug.apk dist/android-hpc.apk
          sha256sum dist/android-hpc.apk | tee dist/android-hpc.apk.sha256
          {
            echo "Automatic build of \`main\` at ${GITHUB_SHA::7} (version ${VERSION}, versionCode $((100 + BUILD)))."
            echo
            echo "Debug-signed with the repository's public debug key (\`app/ci-debug.keystore\`), so it installs"
            echo "as an update over earlier builds from this page. Not a store release."
            echo
            echo "\`\`\`"
            echo "adb install -r android-hpc.apk"
            echo "\`\`\`"
            echo
            echo "SHA-256: \`$(cut -d' ' -f1 dist/android-hpc.apk.sha256)\`"
          } > notes.md
          gh release create "$TAG" dist/android-hpc.apk dist/android-hpc.apk.sha256 \
            --target "$GITHUB_SHA" --title "android-hpc ${VERSION} (build ${BUILD})" \
            --notes-file notes.md --latest
