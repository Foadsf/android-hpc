plugins {
    id 'com.android.application'
}

// The version has one source: project(... VERSION x.y.z) in the root CMakeLists.txt, which the
// native report and hpc_cli also use, so the APK and its reports can never disagree.
def hpcVersion() {
    def m = (file('../CMakeLists.txt').text =~ /project\(android_hpc\s+VERSION\s+([0-9.]+)/)
    if (!m.find()) throw new GradleException('version not found in CMakeLists.txt')
    return m.group(1)
}

android {
    namespace 'org.androidhpc.bench'
    compileSdk 35
    ndkVersion '26.1.10909125'

    defaultConfig {
        applicationId 'org.androidhpc.bench'
        minSdk 26            // AHardwareBuffer NDK API; Vulkan/GLES/EGL are older
        targetSdk 35
        versionCode 5
        versionName hpcVersion()

        ndk {
            // arm64 is the real target; x86_64 lets the app run on emulators/Chromebooks.
            abiFilters 'arm64-v8a', 'x86_64'
        }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static', '-DHPC_BUILD_CLI=OFF'
                targets 'hpcjni'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('../CMakeLists.txt')
            version '3.22.1'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Unsigned by default. Sign with your own key for distribution; see README.
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        abortOnError false
    }
    testOptions {
        // UI smoke tests run the real Activity on Robolectric's Android framework (no device).
        unitTests.includeAndroidResources = true
        unitTests.all {
            systemProperty 'robolectric.graphicsMode', 'NATIVE'
            systemProperty 'hpc.screenshotDir', "${buildDir}/ui-screenshots"
            // Robolectric downloads its Android framework jar from Maven Central at test time;
            // -ProbolectricRepo=<maven mirror URL> points it elsewhere (e.g. when rate-limited).
            if (project.hasProperty('robolectricRepo')) {
                systemProperty 'robolectric.dependency.repo.url', project.property('robolectricRepo')
            }
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
